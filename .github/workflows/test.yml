name: test

# The safety net: the whole suite plus a production build on every push and every pull request,
# on any branch. main publishes (GitHub Pages serves docs/ from it), so a red run here is the
# signal that something reached a branch it should not have.
on:
  push:
  pull_request:

# Read-only token: this job never writes to the repo.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless; cancel it.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the whole suite, slow tier included, passed 15 minutes on a 2-core runner at 6.20.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Everything, slow tier included (*.slow.test.js) — same as `npm run test:all`.
      - run: npx vitest run
      # The build writes docs/ in the runner only; nothing is committed. It is here because a
      # bundle that does not build is a release that cannot ship, and tests do not exercise Vite.
      - run: npm run build

  browser:
    # The browser job (V7 build brief, package 5): both builds, served with the real security headers, walked
    # in real browsers. A SEPARATE job: it does not wait for `test`, `test` does not wait for it, and the
    # nightly data update (update-gilt-data.yml) never runs it — so a browser problem cannot block the data
    # bot. Pictures are made and uploaded with the report; they are not compared until the owner approves a
    # first set (the picture gate: see e2e/screens.spec.js and RELEASING.md).
    # Step 4 adds A's and B's journeys, their named states in the crawl, keyboard and sameness cases and 36
    # pictures: about 4 minutes more, planned under 12 minutes in all against the 15-minute limit (test plan
    # A–B 13.3). If it runs over, cut in that plan's order — never the journeys' counted first answers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Split three ways (step 4 tripled the browser tests); each shard runs its third on its own runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The browsers are cached by the exact Playwright version in package.json; the system libraries are not
      # in the cache, so they are installed either way.
      - id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit firefox
      # The system libraries come from Ubuntu's mirror, which has stalled at ~100 kB/s on some runners (1 Oct 2026: two
      # 20-minute hangs on one shard). Each try is capped at 8 minutes; three tries.
      - if: steps.pwcache.outputs.cache-hit == 'true'
        run: for i in 1 2 3; do timeout 480 npx playwright install-deps chromium webkit firefox && exit 0; echo "install-deps try $i stalled; retrying"; done; exit 1
      # The published build (dist/prod, the current app and V7 exactly as deployed) and V7's test build (dist/test).
      - run: npm run e2e:build
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
