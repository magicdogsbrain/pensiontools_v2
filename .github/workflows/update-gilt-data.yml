name: update-gilt-data

# Refresh public/data/gilts.json (+ docs/ copy, + bundled snapshot) from the DMO gilts-in-issue
# report and Tradeweb FTSE closing prices (T+1, via LateGenXer's published CSV).
on:
  schedule:
    - cron: '30 6 * * TUE-SAT'   # after the T+1 prices land (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gilt-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/fetch-gilt-data.mjs
      # Gate: the fetched data is bundled into the app (src/data/*Snapshot.js) and main publishes,
      # so the whole suite runs against the NEW data before anything is committed. A failing step
      # stops the job here: nothing is committed or pushed, the run goes red and GitHub emails the
      # owner. Yesterday's data stays live until the cause is fixed and the job re-run.
      - run: npm ci
      - name: Test against the fetched data
        run: npx vitest run
      - name: Commit if changed (only reached when the suite passed)
        run: |
          git config user.name "pensiontools-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/gilts.json docs/data/gilts.json src/data/giltsSnapshot.js public/data/equity.json docs/data/equity.json src/data/equitySnapshot.js
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Market data: nightly refresh ($(date -u +%F))"
          git push
